name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - compose.yaml
      - scripts/docker-smoke.sh
      - backend/Dockerfile
      - backend/.dockerignore
      - backend/pyproject.toml
      - backend/uv.lock
      - frontend/Dockerfile
      - frontend/.dockerignore
      - frontend/next.config.ts
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/ekomjah

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
            file: ./backend/Dockerfile
          - name: web
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/tributary-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Exercise the file a stranger downloads: a directory containing compose.yaml
  # and nothing else, pulling the images this run just pushed.
  smoke:
    name: Smoke test the shipped compose file
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "value=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run from the compose file alone
        env:
          TRIBUTARY_VERSION: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tributary-smoke
          cp compose.yaml /tmp/tributary-smoke/
          scripts/docker-smoke.sh /tmp/tributary-smoke

  # Pull requests build the same images locally and run the same checks, so the
  # Dockerfiles are validated before they reach main.
  verify:
    name: Build and smoke test (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          platforms: linux/amd64
          tags: ghcr.io/ekomjah/tributary-api:smoke
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the reader image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          platforms: linux/amd64
          tags: ghcr.io/ekomjah/tributary-web:smoke
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Run from the compose file alone
        env:
          TRIBUTARY_VERSION: smoke
        run: |
          set -euo pipefail
          mkdir -p /tmp/tributary-smoke
          cp compose.yaml /tmp/tributary-smoke/
          scripts/docker-smoke.sh /tmp/tributary-smoke

  # GHCR packages start private; anonymous `docker compose pull` needs them
  # public. GITHUB_TOKEN cannot always change user-scoped package visibility,
  # so this is best effort and the release checklist keeps the manual step.
  visibility:
    name: Make packages public
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - name: Patch visibility
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for package in tributary-api tributary-web; do
            gh api --method PATCH "/user/packages/container/${package}" \
              -f visibility=public
          done
