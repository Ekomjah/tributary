name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tributary
          POSTGRES_PASSWORD: tributary
          POSTGRES_DB: tributary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tributary -d tributary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRIBUTARY_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://tributary:tributary@localhost:5432/tributary_test' || '' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
