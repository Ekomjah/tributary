[project]
name = "tributary"
version = "0.1.0"
description = "A local-first feed reader and visual pipe builder."
readme = "README.md"
authors = [
    { name = "Ekomjah Edet", email = "ekomjahedet@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pydantic-settings>=2.15.0",
    "sentry-sdk>=2.73.0",
    "sqlalchemy>=2.0.55",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tributary = "tributary.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
